<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Pause - Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="eyebrow">— THE DAILY PAUSE</div>
    <h1>A little room<br><em>to think.</em></h1>
    <p class="intro">One good sentence can change the shape of a day. Take one with you.</p>

    <section class="quote-card">
      <div class="meta"><span id="count">01 / 10</span><span>A THOUGHT WORTH KEEPING</span></div>
      <div class="quote-mark">“</div>
      <blockquote id="quote"></blockquote>
      <div class="author" id="author"></div>
      <div class="actions">
        <button id="newQuote">New quote ↻</button>
        <button id="copyQuote">▣ &nbsp; Copy thought</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
